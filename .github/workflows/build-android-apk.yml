name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Cache Android Debug Keystore
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Accept Android SDK Licenses & Install API 37
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null || true
            "$SDK_MANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" || true
          fi
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK to offline_cyberdeck.apk
        run: |
          SRC_APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "No APK found!"
            exit 1
          fi
          cp "$SRC_APK" android/app/build/outputs/apk/debug/offline_cyberdeck.apk
          ls -lh android/app/build/outputs/apk/debug/offline_cyberdeck.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: offline_cyberdeck
          path: android/app/build/outputs/apk/debug/offline_cyberdeck.apk
